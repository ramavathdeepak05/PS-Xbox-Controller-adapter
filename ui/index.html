<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controller Mapping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <filter id="container-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="1" seed="2" result="turbulence" />
        <feGaussianBlur in="turbulence" stdDeviation="1.2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="28" xChannelSelector="R" yChannelSelector="B" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="1.5" result="finalBlur" />
        <feComposite in="finalBlur" in2="SourceGraphic" operator="in" />
      </filter>
    </defs>
  </svg>

  <div class="stage-bg" aria-hidden="true">
    <div class="glow"></div>
    <div class="bokeh bokeh-a"></div>
    <div class="bokeh bokeh-b"></div>
    <div class="bokeh bokeh-c"></div>
    <div class="floor-fade"></div>
  </div>

  <img id="controller-art" class="controller-art" src="./controllers/playstation.png" alt="PlayStation controller">

  <div class="shell">
    <header class="topbar">
      <div class="title-block">
        <h1><span class="title-strong">Controller</span> <span class="title-soft">Mapping</span></h1>
        <p>Assign keyboard keys to each control.</p>
        <div id="device-status" class="device">
          <span class="device-dot"></span>
          <span id="device-text">Detecting controller…</span>
        </div>
      </div>

      <div class="top-actions">
        <div class="nav-pill is-current">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10a4 4 0 0 1 0 8H7a4 4 0 0 1 0-8zm-2.2 4H3m18 0h-1.8M8 12h.01M16 12h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Mapping
        </div>
        <button id="btn-toggle" class="nav-pill" type="button">
          <span id="toggle-icon">II</span>
          <span id="toggle-text">Pause</span>
        </button>
      </div>

      <div class="profile" id="profile-chip">
        <div class="profile-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 18.5c1.2-2.2 3.1-3.3 5.5-3.3s4.3 1.1 5.5 3.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="profile-copy">
          <strong>Default Profile</strong>
          <small id="save-state">Saved</small>
        </div>
      </div>
    </header>

    <main class="stage">
      <div id="shoulder-left" class="shoulder shoulder-left"></div>
      <div id="touch-slot" class="touch-slot"></div>
      <div id="shoulder-right" class="shoulder shoulder-right"></div>
      <div id="col-left" class="col col-left"></div>
      <div class="stage-gap"></div>
      <div id="col-right" class="col col-right"></div>
      <div id="col-center" class="col-center"></div>
    </main>

    <footer class="bottombar">
      <div class="footer-meta">
        <p id="status-note" class="status-note"></p>
      </div>
      <div class="footer-actions">
        <button id="btn-save" class="action action-primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Apply Changes
        </button>
        <button id="btn-reset" class="action" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2-5.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 5.5v4h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Reset to Default
        </button>
        <button id="btn-clear" class="action action-danger" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8m-7 0l.6 10.2a1.5 1.5 0 0 0 1.5 1.3h3.8a1.5 1.5 0 0 0 1.5-1.3L16 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Clear All
        </button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
